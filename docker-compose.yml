# OpenRemote v3
#
# Profile for deploying the custom stack; uses deployment-data named volume
# to expose customisations to the manager and keycloak images. To run this profile you need to specify the following
# environment variables:
#
#    OR_ADMIN_PASSWORD - Initial admin user password
#    OR_HOSTNAME - FQDN hostname of where this instance will be exposed (localhost, IP address or public domain)
#    DEPLOYMENT_VERSION - Tag to use for deployment image (must match the tag used when building the deployment image)
#
# Please see openremote/profile/deploy.yml for configuration details for each service.
#
# To perform updates, build code and prepare Docker images:
#
#   ./gradlew clean installDist
#
# Then recreate deployment image:
#
#  DEPLOYMENT_VERSION=$(git rev-parse --short HEAD)
#  MANAGER_VERSION=$(cd openremote; git rev-parse --short HEAD; cd ..)
#  docker build -t openremote/manager:$MANAGER_VERSION ./openremote/manager/build/install/manager/
#  docker build -t openremote/custom-deployment:$DEPLOYMENT_VERSION ./deployment/build/
#  docker-compose -p custom down
#  docker volume rm custom_deployment-data
#  Do the following volume rm command if you want a clean install (wipe all existing data)
#  docker volume rm custom_postgresql-data
#  OR_ADMIN_PASSWORD=secret OR_HOSTNAME=my.domain.com docker-compose -p custom up -d
#
# All data is kept in volumes. Create a backup of the volumes to preserve data.
#
volumes:
  proxy-data:
  deployment-data:
  postgresql-data:
  manager-data:
  ml-forecast-data:

services:
  # This service will only populate an empty volume on startup and then exit.
  # If the volume already contains data, it exits immediately.
  deployment:
    image: openremote/deployment:custom
    volumes:
      - deployment-data:/deployment

  proxy:
    image: openremote/proxy:${PROXY_VERSION:-latest}
    restart: always
    depends_on:
      manager:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "8883:8883"
      - "127.0.0.1:8404:8404" # Localhost metrics access
    volumes:
      - proxy-data:/deployment
      - deployment-data:/data
    environment:
      LE_EMAIL: ${OR_EMAIL_ADMIN}
      DOMAINNAME: ${OR_HOSTNAME?OR_HOSTNAME must be set}
      DOMAINNAMES: ${OR_ADDITIONAL_HOSTNAMES:-}
      # USE A CUSTOM PROXY CONFIG - COPY FROM https://github.com/openremote/proxy/blob/main/haproxy.cfg
      # HAPROXY_CONFIG: '/data/proxy/haproxy.cfg'

  postgresql:
    image: openremote/postgresql:${POSTGRESQL_VERSION:-latest-slim}
    restart: always
    #shm_size: 128mb
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - manager-data:/storage
    ports:
      - "5432:5432"

  keycloak:
    image: openremote/keycloak:${KEYCLOAK_VERSION:-latest}
    restart: always
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      #- deployment-data:/deployment
      - ./deployment-data:/deployment
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:?OR_ADMIN_PASSWORD must be set}
      KC_HOSTNAME: ${OR_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${OR_SSL_PORT:--1}

  manager:
    image: openremote/manager:${MANAGER_VERSION:-latest}
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "10"
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - manager-data:/storage
      - deployment-data:/deployment
      - ./deployment/map:/deployment/map
      - ./deployment/manager/app/manager_config.json:/deployment/manager/app/manager_config.json:ro
    ports:
      - "127.0.0.1:8405:8405" # Localhost metrics access
    env_file:
      - .env
    environment:
      # Here are some typical environment variables you want to set
      # see openremote/profile/deploy.yml for details
      OR_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD?OR_ADMIN_PASSWORD must be set}
      OR_SETUP_TYPE: # Typical values to support are staging and production
      OR_SETUP_RUN_ON_RESTART:
      OR_EMAIL_HOST:
      OR_EMAIL_USER:
      OR_EMAIL_PASSWORD:
      OR_EMAIL_X_HEADERS:
      OR_EMAIL_FROM:
      OR_EMAIL_ADMIN:
      OR_METRICS_ENABLED: ${OR_METRICS_ENABLED:-true}
      OR_HOSTNAME: ${OR_HOSTNAME?OR_HOSTNAME must be set}
      OR_ADDITIONAL_HOSTNAMES: ${OR_ADDITIONAL_HOSTNAMES:-}
      OR_SSL_PORT: ${OR_SSL_PORT:--1}
      OR_DEV_MODE: ${OR_DEV_MODE:-false}
      #OR_MAP_TILES_PATH: '/efs/europe.mbtiles'
      OR_FORECAST_SOLAR_API_KEY:
      OR_FIREBASE_CONFIG_FILE: /deployment/manager/fcm.json
      OR_KEYCLOAK_PUBLIC_URI:
      OR_MAP_SETTINGS_PATH: ${OR_MAP_SETTINGS_PATH:-/deployment/map/mapsettings.json}
      WEBSERVER_LISTEN_HOST: 0.0.0.0
      IDENTITY_NETWORK_WEBSERVER_PORT: 443
      #IDENTITY_NETWORK_SECURE: true
      #OR_DATA_POINTS_MAX_AGE_DAYS: 1460
      #OR_OPEN_WEATHER_API_APP_ID: ${OR_OPEN_WEATHER_API_APP_ID}
      #OR_FIREBASE_CONFIG_FILE: /deployment/manager/fcm.json

  ml-forecast:
    image: openremote/service-ml-forecast:${ML_FORECAST_VERSION:-latest}
    restart: always
    environment:
      ML_LOG_LEVEL: INFO
      ML_ENVIRONMENT: production
      ML_WEBSERVER_ORIGINS: '["https://${OR_HOSTNAME?OR_HOSTNAME must be set}"]'
      ML_OR_URL: https://${OR_HOSTNAME?OR_HOSTNAME must be set}
      ML_OR_KEYCLOAK_URL: https://${OR_HOSTNAME?OR_HOSTNAME must be set}/auth
      ML_OR_SERVICE_USER: mlforecast
      ML_OR_SERVICE_USER_SECRET: ${ML_OR_SERVICE_USER_SECRET:-secretml}
      ML_OR_SERVICE_URL: https://${OR_HOSTNAME?OR_HOSTNAME must be set}
      ML_API_PUBLISH_DOCS: false
    volumes:
      - ml-forecast-data:/app/deployment/data

  query-exporter:
    image: adonato/query-exporter:latest
    restart: always
    depends_on:
      postgresql:
        condition: service_healthy
      manager:
        condition: service_healthy
    volumes:
      # Mount deployment-data volume containing config.yaml for query-exporter configuration
      # Config file should be at: /deployment/query-exporter/config.yaml
      - deployment-data:/deployment
    ports:
      - "127.0.0.1:8406:9560" # Localhost metrics access
      - "${PRIVATE_IP:-127.0.0.1}:8406:9560" # Allows to also expose metrics on a given IP address,
      # intended to be IP of the interface of the private subnet of the EC2 VM
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      # Database connection settings (matches postgresql service)
      # These can be referenced in the config.yaml file using !env tag
      POSTGRES_HOST: ${OR_DB_HOST:-postgresql}
      POSTGRES_PORT: ${OR_DB_PORT:-5432}
      POSTGRES_DB: ${OR_DB_NAME:-openremote}
      POSTGRES_USER: ${OR_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${OR_DB_PASSWORD:-postgres}
      QE_CONFIG: /deployment/query-exporter/config.yaml
