import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
    id 'com.adarshr.test-logger' version "$testLoggerVersion"
}

apply plugin: "java-library"

configurations {
    mockitoAgent
}

dependencies {
    api project(":model")
    api "io.openremote:openremote-agent:$openremoteVersion"
    api "io.openremote:openremote-manager:$openremoteVersion"

    // https://mvnrepository.com/artifact/com.rabbitmq/amqp-client
    implementation "com.rabbitmq:amqp-client:$rabbitMqAmqpClientVersion"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:$jacksonVersion"


    testImplementation "org.junit.jupiter:junit-jupiter-api:$junitVersion"
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "org.mockito:mockito-junit-jupiter:$mockitoVersion"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junitVersion"

    mockitoAgent("org.mockito:mockito-core:$mockitoVersion") {
        transitive = false
    }
}

tasks.register('installDist') {
    dependsOn jar
}

tasks.withType(Test) {
    environment("LOGGING_CONFIG_FILE", "test/src/logging-test.properties")
}

test {
    workingDir = findProject(":openremote") != null ? project(":openremote").projectDir : rootProject.projectDir
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
    useJUnitPlatform()
    testLogging {
        // set options for log level LIFECYCLE
        events = [
                TestLogEvent.FAILED,
                TestLogEvent.PASSED,
                TestLogEvent.SKIPPED
        ]
        exceptionFormat = TestExceptionFormat.FULL
        showExceptions = true
        showCauses = true
        showStackTraces = true

        // set options for log level DEBUG and INFO
        debug {
            events = [
                    TestLogEvent.STARTED,
                    TestLogEvent.FAILED,
                    TestLogEvent.PASSED,
                    TestLogEvent.SKIPPED,
                    TestLogEvent.STANDARD_ERROR
            ]
            exceptionFormat = TestExceptionFormat.FULL
        }
        info.events = debug.events
        info.exceptionFormat = debug.exceptionFormat

        afterTest { desc, result ->
            logger.quiet "${desc.className} > ${desc.name} took: ${(result.endTime - result.startTime)}ms"
        }

        afterSuite { desc, result ->
            if (!desc.parent) { // will match the outermost suite
                def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
                def startItem = '|  ', endItem = '  |'
                def repeatLength = startItem.length() + output.length() + endItem.length()
                println('\n' + ('-' * repeatLength) + '\n' + startItem + output + endItem + '\n' + ('-' * repeatLength))
            }
        }
    }
}
